<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devyvt Tools</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0b0f;
        color: white;
    }

    header {
        padding: 25px;
        text-align: center;
        border-bottom: 1px solid #222;
    }

    header h1 {
        margin: 0;
        font-size: 28px;
    }

    header p {
        color: #888;
        margin: 8px 0 0;
    }

    .container {
        width: min(900px, 92%);
        margin: 30px auto;
    }

    .tool {
        background: #111116;
        border: 1px solid #24242b;
        border-radius: 14px;
        padding: 22px;
        margin-bottom: 20px;
    }

    .tool h2 {
        margin-top: 0;
    }

    .tool p {
        color: #999;
    }

    input {
        width: 100%;
        padding: 13px;
        border-radius: 9px;
        border: 1px solid #333;
        background: #09090c;
        color: white;
        outline: none;
        margin-bottom: 10px;
    }

    button {
        padding: 11px 16px;
        border: none;
        border-radius: 9px;
        background: #5865f2;
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin: 4px;
    }

    button:hover {
        opacity: 0.85;
    }

    button.secondary {
        background: #222229;
    }

    .preview {
        margin-top: 18px;
        padding: 15px;
        background: #09090c;
        border-radius: 10px;
        text-align: center;
        min-height: 100px;
    }

    .preview img {
        max-width: 100%;
        max-height: 500px;
        border-radius: 8px;
    }

    .resize-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 10px;
    }

    canvas {
        display: none;
    }

    .status {
        margin-top: 10px;
        color: #aaa;
        font-size: 14px;
    }

    .size-info {
        margin-top: 10px;
        color: #aaa;
    }
</style>
</head>

<body>

<header>
    <h1>Devyvt Tools</h1>
    <p>Simple tools for Roblox developers</p>
</header>

<div class="container">

    <!-- ROBLOX IMAGE VIEWER -->
    <div class="tool">
        <h2>🖼️ Roblox Image Viewer</h2>
        <p>Paste a Roblox ImageLabel / asset ID to view the image.</p>

        <input
            id="assetInput"
            type="text"
            placeholder="Example: 114958657072825 or rbxassetid://114958657072825"
        >

        <button onclick="loadRobloxImage()">View Image</button>
        <button class="secondary" onclick="copyAssetId()">Copy ID</button>

        <div class="preview" id="robloxPreview">
            <p>Image will appear here</p>
        </div>

        <div class="status" id="assetStatus"></div>
    </div>


    <!-- IMAGE RESIZER -->
    <div class="tool">
        <h2>📐 Roblox Image Resizer</h2>
        <p>Resize your image for Roblox icons or thumbnails.</p>

        <input id="imageInput" type="file" accept="image/*">

        <div class="resize-buttons">
            <button onclick="resizeImage(512, 512, 'Roblox Icon')">
                Roblox Icon
            </button>

            <button onclick="resizeImage(1920, 1080, 'Roblox Thumbnail')">
                Roblox Thumbnail
            </button>
        </div>

        <div class="preview">
            <canvas id="canvas"></canvas>
            <img id="resizePreview" style="display:none;">
            <p id="resizeText">Choose an image and a size.</p>
        </div>

        <div class="size-info" id="sizeInfo"></div>

        <button
            id="downloadButton"
            style="display:none;"
            onclick="downloadResized()"
        >
            Download PNG
        </button>
    </div>

</div>

<script>

/* =========================
   ROBLOX IMAGE VIEWER
========================= */

let currentAssetId = "";

function extractAssetId(input) {

    input = input.trim();

    // Remove rbxassetid://
    input = input.replace("rbxassetid://", "");

    // Find numbers in Roblox URLs or normal text
    const match = input.match(/\d+/);

    if (!match) {
        return null;
    }

    return match[0];
}


function loadRobloxImage() {

    const input = document.getElementById("assetInput").value;
    const assetId = extractAssetId(input);

    const preview = document.getElementById("robloxPreview");
    const status = document.getElementById("assetStatus");

    if (!assetId) {
        status.textContent = "Please enter a valid Roblox asset ID.";
        return;
    }

    currentAssetId = assetId;

    /*
        Roblox thumbnail endpoint.
        This asks Roblox for a rendered thumbnail of the asset.
    */

    const imageURL =
        "https://thumbnails.roblox.com/v1/assets?assetIds=" +
        assetId +
        "&returnPolicy=PlaceHolder&size=420x420&format=Png&isCircular=false";

    fetch(imageURL)
        .then(response => response.json())
        .then(data => {

            if (
                !data.data ||
                !data.data[0] ||
                !data.data[0].imageUrl
            ) {
                throw new Error("Image not found");
            }

            const image = data.data[0].imageUrl;

            preview.innerHTML = `
                <img src="${image}" alt="Roblox Asset">
            `;

            status.textContent = "Asset ID: " + assetId;
        })
        .catch(error => {

            preview.innerHTML = `
                <p>Could not load this Roblox image.</p>
            `;

            status.textContent =
                "Make sure the ID is a valid public Roblox image/decal.";
        });
}


function copyAssetId() {

    if (!currentAssetId) {
        alert("Load an image first.");
        return;
    }

    navigator.clipboard.writeText(currentAssetId);

    document.getElementById("assetStatus").textContent =
        "Copied asset ID!";
}


/* =========================
   IMAGE RESIZER
========================= */

let selectedImage = null;
let lastWidth = 0;
let lastHeight = 0;


document
    .getElementById("imageInput")
    .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {

            const image = new Image();

            image.onload = function() {
                selectedImage = image;

                document.getElementById("resizeText").textContent =
                    "Image loaded. Choose a Roblox size.";

                document.getElementById("sizeInfo").textContent =
                    "Original: " +
                    image.width +
                    " × " +
                    image.height;
            };

            image.src = e.target.result;
        };

        reader.readAsDataURL(file);
    });


function resizeImage(targetWidth, targetHeight, name) {

    if (!selectedImage) {
        alert("Choose an image first.");
        return;
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = targetWidth;
    canvas.height = targetHeight;

    /*
        Center crop the image so it fills the
        target dimensions without stretching.
    */

    const sourceRatio =
        selectedImage.width / selectedImage.height;

    const targetRatio =
        targetWidth / targetHeight;

    let sourceWidth = selectedImage.width;
    let sourceHeight = selectedImage.height;
    let sourceX = 0;
    let sourceY = 0;

    if (sourceRatio > targetRatio) {

        sourceWidth =
            selectedImage.height * targetRatio;

        sourceX =
            (selectedImage.width - sourceWidth) / 2;

    } else {

        sourceHeight =
            selectedImage.width / targetRatio;

        sourceY =
            (selectedImage.height - sourceHeight) / 2;
    }

    ctx.clearRect(
        0,
        0,
        targetWidth,
        targetHeight
    );

    ctx.drawImage(
        selectedImage,

        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,

        0,
        0,
        targetWidth,
        targetHeight
    );

    lastWidth = targetWidth;
    lastHeight = targetHeight;

    const preview =
        document.getElementById("resizePreview");

    preview.src =
        canvas.toDataURL("image/png");

    preview.style.display = "inline-block";

    document.getElementById("resizeText").textContent =
        name + " ready!";

    document.getElementById("sizeInfo").textContent =
        targetWidth +
        " × " +
        targetHeight;

    document.getElementById("downloadButton").style.display =
        "inline-block";
}


function downloadResized() {

    const canvas =
        document.getElementById("canvas");

    if (!canvas.width) return;

    const link =
        document.createElement("a");

    link.download =
        "devyvt-" +
        lastWidth +
        "x" +
        lastHeight +
        ".png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();
}

</script>

</body>
</html>
