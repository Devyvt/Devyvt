<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devyvt Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0e;
            color: white;
        }

        header {
            padding: 22px 30px;
            background: #111114;
            border-bottom: 1px solid #24242a;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
            color: #888;
            font-size: 14px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: #141417;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 25px;
        }

        .upload {
            display: block;
            border: 2px dashed #3a3a42;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload:hover {
            background: #19191d;
            border-color: #666;
        }

        .upload input {
            display: none;
        }

        .upload-title {
            font-size: 20px;
            font-weight: bold;
        }

        .upload-subtitle {
            margin-top: 8px;
            color: #888;
            font-size: 14px;
        }

        .types {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .type {
            flex: 1;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #303038;
            background: #19191d;
            color: white;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: 0.2s;
        }

        .type:hover {
            background: #222228;
            border-color: #555;
        }

        .type.active {
            background: #25252c;
            border-color: white;
        }

        .type strong {
            display: block;
            font-size: 17px;
        }

        .type span {
            display: block;
            color: #888;
            margin-top: 5px;
            font-size: 13px;
        }

        .preview {
            display: none;
            margin-top: 30px;
        }

        .preview h2 {
            margin-bottom: 12px;
            font-size: 18px;
        }

        .preview-box {
            width: 100%;
            min-height: 280px;
            padding: 20px;
            background: #09090b;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #canvas {
            max-width: 100%;
            max-height: 500px;
            width: auto;
            height: auto;
            border-radius: 8px;
        }

        .info {
            margin-top: 12px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .download {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .download:hover {
            background: #ddd;
        }

        .download:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .types {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Devyvt Tools</h1>
    <p>Simple tools for Roblox developers</p>
</header>

<div class="container">

    <div class="card">

        <!-- IMAGE UPLOAD -->

        <label class="upload" for="fileInput">

            <input
                type="file"
                id="fileInput"
                accept="image/png,image/jpeg,image/webp"
            >

            <div class="upload-title">
                Upload an image
            </div>

            <div class="upload-subtitle">
                PNG, JPG or WEBP
            </div>

        </label>


        <!-- TYPE SELECTOR -->

        <div class="types">

            <button
                type="button"
                class="type active"
                id="iconButton"
            >
                <strong>Roblox Icon</strong>
                <span>512 × 512</span>
            </button>


            <button
                type="button"
                class="type"
                id="thumbnailButton"
            >
                <strong>Roblox Thumbnail</strong>
                <span>1920 × 1080</span>
            </button>

        </div>


        <!-- PREVIEW -->

        <div class="preview" id="preview">

            <h2>Preview</h2>

            <div class="preview-box">
                <canvas id="canvas"></canvas>
            </div>

            <div class="info" id="sizeInfo">
                512 × 512
            </div>

            <button
                type="button"
                class="download"
                id="downloadButton"
                disabled
            >
                Download PNG
            </button>

        </div>

    </div>

</div>


<script>

    const fileInput = document.getElementById("fileInput");

    const iconButton =
        document.getElementById("iconButton");

    const thumbnailButton =
        document.getElementById("thumbnailButton");

    const preview =
        document.getElementById("preview");

    const canvas =
        document.getElementById("canvas");

    const sizeInfo =
        document.getElementById("sizeInfo");

    const downloadButton =
        document.getElementById("downloadButton");


    let selectedType = "icon";

    let uploadedImage = null;


    /*
        TARGET SIZES
    */

    const sizes = {

        icon: {
            width: 512,
            height: 512
        },

        thumbnail: {
            width: 1920,
            height: 1080
        }

    };


    /*
        ICON BUTTON
    */

    iconButton.addEventListener("click", function () {

        selectedType = "icon";

        iconButton.classList.add("active");

        thumbnailButton.classList.remove("active");

        updateSizeText();

        if (uploadedImage) {
            resizeImage();
        }

    });


    /*
        THUMBNAIL BUTTON
    */

    thumbnailButton.addEventListener("click", function () {

        selectedType = "thumbnail";

        thumbnailButton.classList.add("active");

        iconButton.classList.remove("active");

        updateSizeText();

        if (uploadedImage) {
            resizeImage();
        }

    });


    /*
        IMAGE UPLOAD
    */

    fileInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }


        const reader = new FileReader();


        reader.onload = function (event) {

            const img = new Image();


            img.onload = function () {

                uploadedImage = img;

                preview.style.display = "block";

                downloadButton.disabled = false;

                resizeImage();

            };


            img.src = event.target.result;

        };


        reader.readAsDataURL(file);

    });


    /*
        UPDATE SIZE TEXT
    */

    function updateSizeText() {

        const size = sizes[selectedType];

        sizeInfo.textContent =
            size.width + " × " + size.height;

    }


    /*
        RESIZE IMAGE
    */

    function resizeImage() {

        if (!uploadedImage) {
            return;
        }


        const target =
            sizes[selectedType];


        canvas.width =
            target.width;

        canvas.height =
            target.height;


        const ctx =
            canvas.getContext("2d");


        ctx.clearRect(
            0,
            0,
            target.width,
            target.height
        );


        /*
            CALCULATE CROP
        */

        const imageRatio =
            uploadedImage.width /
            uploadedImage.height;


        const targetRatio =
            target.width /
            target.height;


        let sourceWidth;
        let sourceHeight;
        let sourceX;
        let sourceY;


        if (imageRatio > targetRatio) {

            /*
                IMAGE IS TOO WIDE
            */

            sourceHeight =
                uploadedImage.height;

            sourceWidth =
                uploadedImage.height *
                targetRatio;

            sourceX =
                (uploadedImage.width -
                sourceWidth) / 2;

            sourceY = 0;

        } else {

            /*
                IMAGE IS TOO TALL
            */

            sourceWidth =
                uploadedImage.width;

            sourceHeight =
                uploadedImage.width /
                targetRatio;

            sourceX = 0;

            sourceY =
                (uploadedImage.height -
                sourceHeight) / 2;

        }


        /*
            DRAW CROPPED IMAGE
        */

        ctx.drawImage(

            uploadedImage,

            sourceX,
            sourceY,

            sourceWidth,
            sourceHeight,

            0,
            0,

            target.width,
            target.height

        );


        updateSizeText();

    }


    /*
        DOWNLOAD
    */

    downloadButton.addEventListener("click", function () {

        if (!uploadedImage) {
            return;
        }


        const link =
            document.createElement("a");


        if (selectedType === "icon") {

            link.download =
                "roblox-icon.png";

        } else {

            link.download =
                "roblox-thumbnail.png";

        }


        link.href =
            canvas.toDataURL("image/png");


        link.click();

    });

</script>

</body>
</html>
